<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivre ma commande | Oreva</title>
  <meta name="theme-color" content="#1d0f13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2545b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff1ee'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="layout.css">
</head>
<body class="account-page" data-home="index.html" data-checkout="checkout.html">

  <header class="site-header" data-header></header>

  <main class="acct-wrap narrow">
    <header class="panel-head"><div><span class="eyebrow">Suivi de colis</span><h1>Suivre ma commande</h1>
      <p>Entrez votre numéro de commande et le courriel utilisé lors de l'achat.</p></div></header>
    <form id="trackForm" class="table-card" novalidate>
      <div class="grid-2">
        <div class="field"><label for="t-id">Numéro de commande</label><input id="t-id" name="orderId" placeholder="OR-1001" autocomplete="off"><small class="err" data-err="orderId"></small></div>
        <div class="field"><label for="t-email">Courriel</label><input id="t-email" name="email" type="email" autocomplete="email"><small class="err" data-err="email"></small></div>
      </div>
      <p class="co-alert bad" data-alert hidden role="alert"></p>
      <button class="btn btn-primary btn-lg" type="submit"><span class="spinner" aria-hidden="true"></span><span class="pay-label">Suivre ma commande</span></button>
      <p class="muted small" data-auth-in hidden>Vous êtes connecté(e) : retrouvez toutes vos commandes dans <a class="text-link" href="compte.html#commandes">votre compte</a>.</p>
      <p class="muted small" data-auth-out>Vous avez un compte ? <a class="text-link" href="compte.html?next=suivi.html">Connectez-vous</a> pour voir toutes vos commandes.</p>
    </form>
    <section id="trackResult" class="order" hidden></section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
  <script src="suivi.js"></script>
</body>
</html>
