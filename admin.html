<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration | Oreva</title>
  <meta name="theme-color" content="#1d0f13">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2545b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff1ee'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">

<body class="account-page" data-home="index.html" data-checkout="checkout.html">

  <header class="site-header" data-header></header>

  <main class="acct-wrap">
    <section id="adminLogin" class="table-card narrow-card" hidden>
      <h1>Administration</h1>
      <form id="keyForm"><div class="field"><label for="a-key">Clé d'administration</label><input id="a-key" type="password" autocomplete="off"><small class="err" id="keyErr"></small></div>
      <button class="btn btn-primary" type="submit">Entrer</button></form>
    </section>
    <section id="adminApp" hidden>
      <header class="panel-head"><div><h1>Administration</h1><p id="adminSub"></p></div><button class="btn btn-ghost-dark" type="button" id="adminOut">Quitter</button></header>
      <div class="stat-grid" id="adminStats"></div>
      <nav class="admin-tabs" id="adminTabs"></nav>
      <div id="adminPanel"></div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
